name: Publish Images

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

jobs:
    publish:
        name: Publish Images
        runs-on: ubuntu-latest

        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4

            - name: Login to Azure
              uses: azure/login@v2
              with:
                 creds: ${{ secrets.AZURE_CREDENTIALS }}
            - name: Login to azure container Registry
              run: 
                az acr login --name ${{secrets.ACR_NAME}}
            - name: Build Backend Image
              run: docker build -t ${{ secrets.ACR_NAME }}.azurecr.io/backend:${{ github.sha }} ./backend
            - name: Push Backend Image
              run: docker push ${{ secrets.ACR_NAME }}.azurecr.io/backend:${{ github.sha }}