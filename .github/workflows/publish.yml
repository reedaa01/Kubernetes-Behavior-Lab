name: Publish Images

permissions:
  contents: write

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success'
    name: Publish Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Login to azure container Registry
        run: |
          az acr login --name ${{secrets.ACR_NAME}}
      - name: Build Backend Image
        run: docker build -t ${{ secrets.ACR_NAME }}.azurecr.io/backend:${{ github.event.workflow_run.head_sha }} ./backend
      - name: Push Backend Image
        run: docker push ${{ secrets.ACR_NAME }}.azurecr.io/backend:${{ github.event.workflow_run.head_sha }}
      - name: Build Frontend Image
        run: docker build -t ${{ secrets.ACR_NAME }}.azurecr.io/frontend:${{ github.event.workflow_run.head_sha }} ./frontend
      - name: Push Frontend Image
        run: docker push ${{ secrets.ACR_NAME }}.azurecr.io/frontend:${{ github.event.workflow_run.head_sha }}

      - name: Install yq
        uses: mikefarah/yq@v4

      - name: Update Helm image tags
        run: |
          yq -i '.backend.image.tag = "${{ github.event.workflow_run.head_sha }}"' kubelab/values.yaml
          yq -i '.frontend.image.tag = "${{ github.event.workflow_run.head_sha }}"' kubelab/values.yaml

      - name: Commit updated Helm values
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add kubelab/values.yaml

          git diff --cached --quiet || git commit -m "chore: update image tags to ${{ github.event.workflow_run.head_sha }}"

          git push