name: Publish Images

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

jobs:
    publish:
        name: Publish Images
        runs-on: ubuntu-latest

        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4

            - name: Login to Azure
              uses: azure/login@v2
              with:
                 creds: ${{ secrets.AZURE_CREDENTIALS }}