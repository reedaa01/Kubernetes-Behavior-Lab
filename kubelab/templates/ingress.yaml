apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.ingressCustom.name }}
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - coupleshere.online
        - www.coupleshere.online
      secretName: coupleshere-tls
  rules:
    {{- toYaml .Values.ingressCustom.rules | nindent 4 }}
